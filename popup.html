<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div id="view-main" class="view active">
    <h1>Main Menu</h1>
    <button id="btn-settings">Open Settings</button>
    <button id="btn-colors">Color Sliders</button>
  </div>

  <div id="view-settings" class="view">
    <button class="back-btn">Back</button>
    <h2>Settings</h2>
    <label>Text Font Size</label>
    <input type="range" min="0" max="50" id="r-slider">
    <label><input type="checkbox" id="notify-toggle"> Enable Dark Mode</label>
  </div>

  <div id="view-colors" class="view">
    <button class="back-btn">Back</button>
    <h2>Colors</h2>
    <label>Red</label>
    <input type="range" min="0" max="255" id="r-slider">
    <label>Green</label>
    <input type="range" min="0" max="255" id="g-slider">
    <label>Blue</label>
    <input type="range" min="0" max="255" id="b-slider">
  </div>

  <script src="popup.js"></script>
</body>
</html>

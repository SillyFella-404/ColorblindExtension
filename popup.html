<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Main menu page -->
  <div id="view-main" class="view">
    
    <h1>Main Menu</h1>

    <!-- Navigation buttons -->
    <button id="btn-settings">Open Settings</button>
    <button id="btn-colors">Color Sliders</button>
    
  </div>

  
<!-- Settings page -->
  <div id="view-settings" class="view" style="display: none;">
    
    <button class="back-btn">Back</button>
    <h2>Settings</h2>
    <label><input type="checkbox"> Enable Notifications</label>
    
  </div>

<!-- Color sliders page -->
  <div id="view-colors" class="view">
    
    <button class="back-btn">Back</button>
    <h2>Colors</h2>
    <input type="range" min="0" max="255" id="r-slider">
    <input type="range" min="0" max="255" id="g-slider">
    <input type="range" min="0" max="255" id="b-slider">
    
  </div>

  <script src="popup.js"></script>
</body>
</html>

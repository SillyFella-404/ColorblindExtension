<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div id="view-main" class="view active">
    <h1>Main Menu</h1>
    <button id="btn-settings">Open Settings</button>
    <button id="btn-colors">Color Sliders</button>
  </div>

  <div id="view-settings" class="view">
    <button class="back-btn">Back</button>
    <h2>Settings</h2>
    <label><input type="checkbox" id="notify-toggle"> Enable Notifications</label>
  </div>

  <div id="view-colors" class="view">
    <button class="back-btn">Back</button>
    <h2>Colors</h2>
    
    <label for="color-menu">Select Category:</label>
    <select id="color-menu">
      <option value="none">-- select --</option>
      <option value="exposure">Exposure</option>
    </select>

    <div id="exposure-section" class="hidden">
      <h3>Exposure</h3>
      
      <div class="slider-group">
        <label>Red: <span id="r-val">0</span></label>
        <input type="range" min="-100" max="100" value="0" id="r-slider">
      </div>

      <div class="slider-group">
        <label>Green: <span id="g-val">0</span></label>
        <input type="range" min="-100" max="100" value="0" id="g-slider">
      </div>

      <div class="slider-group">
        <label>Blue: <span id="b-val">0</span></label>
        <input type="range" min="-100" max="100" value="0" id="b-slider">
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
